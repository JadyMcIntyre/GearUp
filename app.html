:root{
  --paper:#E6E7E3; --surface:#F3F3F0; --ink:#000; --body:#2B2D2E; --mute:#686B6D; --rule:#C6C8C3; --faint:#D7D8D4;
  --decide:#F2B705; --on-decide:#000;
  --mono:"Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; --add:#DFEADB; --add-mark:#3D7443; --del:#F2E0DC; --del-mark:#9E4236;
  --font:"Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#1C1D1D; --surface:#262727; --ink:#F2F2EF; --body:#D6D7D4; --mute:#9A9D9E; --rule:#3E4040; --faint:#303232; --add:#213129; --add-mark:#8FC495; --del:#3A2725; --del-mark:#E39A8F;
  color-scheme:dark; }}
:root[data-theme="dark"]{ --paper:#1C1D1D; --surface:#262727; --ink:#F2F2EF; --body:#D6D7D4; --mute:#9A9D9E; --rule:#3E4040; --faint:#303232; --add:#213129; --add-mark:#8FC495; --del:#3A2725; --del-mark:#E39A8F; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--body);font-family:var(--font);overflow:hidden;overflow:clip;
  -webkit-font-smoothing:antialiased;}
.calc input{font-variant-numeric:tabular-nums}
.h1,.h2,.h3,.lead,.quote,.display{text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--decide);outline-offset:3px;border-radius:4px}

/* Fixed presentation stage, scaled to fit */
#fit{position:fixed;inset:0;overflow:hidden;overflow:clip;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;
  display:grid;grid-template-rows:88px 1fr 72px;background:var(--paper)}

/* Header */
header{display:grid;grid-template-columns:260px 1fr 260px;align-items:center;padding:0 64px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand svg{width:26px;height:28px}
nav.rail{display:flex;justify-content:center;gap:40px}
.rail button{background:none;border:0;padding:30px 0 27px;font-size:16px;color:var(--mute);cursor:pointer;
  border-bottom:2px solid transparent;font-weight:450}
.rail button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.rail button.reserved{border-bottom-style:dashed}
.rail button.reserved[aria-current="step"]{border-bottom-color:var(--mute)}
.rail .tag{color:var(--mute);font-size:13px;margin-left:6px}
.presenter{justify-self:end;font-size:15px;color:var(--mute)}
.presenter b{color:var(--ink);font-weight:550}

/* Footer */
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 64px;border-top:1px solid var(--rule);font-size:14px;color:var(--mute)}
.disclosure{display:flex;align-items:center;gap:10px}
.disclosure i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.disclosure.replay{color:var(--ink)}
.disclosure.replay i{background:var(--ink);border-color:var(--ink)}
.dots{display:flex;gap:8px;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots span.on{background:var(--ink);width:22px;border-radius:3px}
.controls{justify-self:end;display:flex;gap:8px}
.ctl{background:none;border:1px solid var(--rule);border-radius:20px;height:36px;padding:0 16px;font-size:14px;color:var(--body);cursor:pointer}
.ctl:hover{border-color:var(--mute)}
.ctl[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctl.icon{width:36px;padding:0;display:grid;place-items:center}
.ctl.icon svg{width:14px;height:14px}

/* Main */
main{position:relative;overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;padding:64px 96px 48px;display:flex;flex-direction:column}
.view.enter{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:0}to{opacity:1}}

h1,h2,h3,p{margin:0}
.display{font-size:96px;line-height:.98;letter-spacing:-.035em;font-weight:500;color:var(--ink)}
.h1{font-size:60px;line-height:1.04;letter-spacing:-.028em;font-weight:500;color:var(--ink);max-width:22ch}
.h2{font-size:40px;line-height:1.1;letter-spacing:-.02em;font-weight:500;color:var(--ink)}
.h3{font-size:26px;line-height:1.2;letter-spacing:-.01em;font-weight:500;color:var(--ink)}
.lead{font-size:26px;line-height:1.38;color:var(--body);max-width:36ch}
.body{font-size:19px;line-height:1.5;max-width:52ch}
.small{font-size:15px;line-height:1.45;color:var(--mute);max-width:60ch}
.k{color:var(--mute)}

/* Mark */
.mark{color:var(--ink);display:block}
.mark .lift{transform-box:fill-box}
.mark.animate .lift{animation:lift 1.4s cubic-bezier(.2,.7,.1,1) .35s both}
@keyframes lift{from{transform:translateY(36px)}to{transform:translateY(0)}}

/* Scene 1 */
.title-grid{display:grid;grid-template-columns:380px 1fr;gap:96px;align-items:center;flex:1}
.title-grid .mark{width:340px;height:366px}
.title-grid .sub{margin-top:36px;font-size:22px;color:var(--mute);line-height:1.45}
.statement{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px}
.statement .lead{max-width:40ch}
.statement .h1{max-width:25ch}
.envs{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:48px}
.env{background:var(--surface);border-radius:14px;padding:36px 40px;display:flex;flex-direction:column;gap:14px;min-height:248px}
.env .who{font-size:15px;color:var(--mute)}
.env .reach{margin-top:auto;font-size:17px;color:var(--ink);display:flex;align-items:center;gap:10px}
.reach-bar{height:6px;border-radius:3px;background:var(--ink)}
.flow{display:flex;align-items:center;gap:0;margin-top:40px}
.flow .st{font-size:20px;color:var(--ink);padding:12px 22px;border:1px solid var(--rule);border-radius:24px}
.flow .st.decide{background:var(--decide);color:var(--on-decide);border-color:var(--decide);font-weight:550}
.flow .ln{width:56px;height:1px;background:var(--rule)}
.flow .note{margin-left:28px}

/* Task Manager reserved */
.reserved-frame{flex:1;border:2px dashed var(--rule);border-radius:18px;display:flex;flex-direction:column;justify-content:center;padding:64px 80px;gap:22px}
.bridge{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:80px}
.bridge .halves{display:flex;gap:40px;align-items:center}
.half{display:flex;flex-direction:column;gap:12px;font-size:17px;color:var(--mute)}
.half svg{width:150px;height:300px}

/* Value */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:56px}
.three div{border-top:2px solid var(--ink);padding-top:22px}
.three .h3{margin-bottom:12px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--mute);margin-top:12px}
.status i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}

.costs{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:40px;flex:1}
.cost{background:var(--surface);border-radius:14px;padding:36px 40px;display:flex;flex-direction:column}
.cost .label{font-size:15px;color:var(--mute)}
.cost .h3{margin:6px 0 26px}
.calc{display:flex;align-items:center;gap:14px;font-size:20px;color:var(--ink)}
.calc input{width:120px;height:52px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);padding:0 14px;font-size:24px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:26px;padding:3px}
.seg button{border:0;background:none;height:44px;padding:0 18px;border-radius:22px;font-size:16px;cursor:pointer;color:var(--body)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.result{font-size:72px;letter-spacing:-.03em;color:var(--ink);font-weight:500;margin:26px 0 4px;line-height:1}
.result small{font-size:22px;letter-spacing:0;color:var(--mute);font-weight:400;margin-left:8px}
.presets{display:flex;gap:10px;margin-top:20px}
.excl{margin-top:auto;padding-top:20px;border-top:1px solid var(--rule);max-width:none}
.unverified{font-size:56px;letter-spacing:-.025em;color:var(--mute);font-weight:500;margin:26px 0 18px;line-height:1}

.measure{display:grid;grid-template-columns:7fr 5fr;gap:80px;margin-top:48px;flex:1}
.mlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.mlist li{padding:22px 0;border-bottom:1px solid var(--rule);font-size:24px;color:var(--ink);letter-spacing:-.01em}
.future{border:2px dashed var(--rule);border-radius:14px;padding:32px 36px;align-self:start}
.future .h3{margin:10px 0 12px}

.close{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:40px}
.close .mark{width:150px;height:162px}

/* Shared controls (carried from iteration 1) */
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:26px;border:0;background:var(--ink);color:var(--paper);font-size:17px;font-weight:500;cursor:pointer}
.btn.quiet{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.quiet:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);font-size:16px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule);cursor:pointer}
.linkbtn:hover{text-decoration-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 12px;border-radius:13px;border:1.5px solid var(--ink);font-size:13.5px;color:var(--ink);white-space:nowrap}
.verdict{font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.verdict i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);display:inline-block;position:relative}
.verdict i::after{content:"";position:absolute;left:-2px;right:-2px;top:2.5px;height:2px;background:var(--ink);transform:rotate(-45deg)}

/* ---------- GitLab journey ---------- */
.journey{position:absolute;inset:0;padding:22px 64px 20px;display:grid;grid-template-rows:auto 1fr;row-gap:20px}
.jstrip{display:grid;grid-template-columns:repeat(5,1fr) .8fr;gap:14px}
.jstrip button{background:none;border:0;border-top:2px solid var(--rule);padding:10px 0 0;text-align:left;font-size:14px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .3s,color .3s}
.jstrip button b{font-weight:500}
.jstrip button.done{border-top-color:var(--mute)}
.jstrip button.now{border-top-color:var(--ink);color:var(--ink)}
.jstrip button.decide.now{border-top-color:var(--decide)}
.jstrip .bd{margin-left:auto;display:flex;gap:4px}
.jstrip .bd i{width:5px;height:5px;border-radius:50%;background:var(--rule);transition:background .3s}
.jstrip .bd i.on{background:var(--ink)}
.jbody{display:grid;grid-template-columns:316px 1fr;gap:48px;min-height:0}

/* Narration */
.narr{display:flex;flex-direction:column;min-height:0;padding-top:4px}
.cap{font-size:38px;line-height:1.1;letter-spacing:-.022em;font-weight:500;color:var(--ink);text-wrap:balance}
.capsub{font-size:19px;line-height:1.45;margin-top:18px;color:var(--body);text-wrap:pretty}
.capwrap.swap{animation:capIn .42s ease both}
@keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.legend{margin-top:auto;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.35;color:var(--mute);border-top:1px solid var(--rule);padding-top:14px}
.legend span{display:flex;gap:9px;align-items:baseline}
.legend span::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;flex:none;transform:translateY(-1px)}
.legend span.rec{color:var(--body)}
.legend span.rec::before{background:currentColor}
.explore{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;min-height:20px}
.explore .linkbtn{font-size:14px;color:var(--mute)}

/* Product window */
.win{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:40px 1fr;min-height:0}
.winbar{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--rule);font-size:13.5px;color:var(--mute)}
.lights{display:flex;gap:6px}.lights i{width:10px;height:10px;border-radius:50%;background:var(--rule)}
.tool{position:relative;height:18px;min-width:160px}
.tool span{position:absolute;left:0;top:0;white-space:nowrap;color:var(--ink);font-weight:550;opacity:0;transition:opacity .3s}
.recon{margin-left:auto}
.apps{position:relative;min-height:0}
.app{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(18px);
  transition:opacity .38s ease,transform .38s cubic-bezier(.2,.7,.2,1),visibility 0s linear .38s}
.journey[data-app="jira"] .app-jira,.journey[data-app="mr"] .app-mr,.journey[data-app="teams"] .app-teams{opacity:1;visibility:visible;transform:none;
  transition:opacity .38s ease .1s,transform .42s cubic-bezier(.2,.7,.2,1) .1s,visibility 0s}
.journey[data-app="jira"] .tool .t-jira,.journey[data-app="mr"] .tool .t-mr,.journey[data-app="teams"] .tool .t-teams{opacity:1}
.av{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;font-size:13px;color:var(--ink);flex:none}
.av .mark{width:15px;height:16px}
.mono{font-family:var(--mono)}

/* Jira-style task */
.jira{padding:24px 32px;height:100%;display:flex;flex-direction:column}
.crumbs{font-size:14px;color:var(--mute)}
.jtitle{font-size:28px;line-height:1.2;color:var(--ink);font-weight:500;letter-spacing:-.015em;margin:8px 0 22px}
.jcols{display:grid;grid-template-columns:1fr 250px;gap:40px;min-height:0}
.fh{font-size:14px;color:var(--mute);margin:0 0 8px;font-weight:500}
.jdesc{font-size:17px;line-height:1.55;max-width:54ch;margin:0 0 24px;color:var(--body)}
.ac{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ac li{position:relative;display:grid;grid-template-columns:22px 26px 1fr;gap:6px;align-items:start;padding:13px 16px;border-radius:10px;font-size:17px;line-height:1.45;color:var(--ink)}
.ac .box{width:17px;height:17px;border:1.5px solid var(--mute);border-radius:4px;margin-top:4px}
.ac .num{color:var(--mute)}
.ac li::after{content:"";position:absolute;inset:0;border-radius:10px;border:2px solid var(--ink);opacity:0;pointer-events:none}
.journey.p1 .ac li.focus{animation:acHi .5s ease both}
.journey.p1 .ac li.focus::after{animation:fadeIn .45s ease .1s both}
.journey.p1 .ac li:not(.focus){animation:dimTo .5s ease both}
@keyframes acHi{to{background:var(--paper)}}
@keyframes dimTo{to{opacity:.42}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.jside dl{margin:0;display:grid;grid-template-columns:96px 1fr;row-gap:14px;font-size:15px;align-items:center}
.jside dt{color:var(--mute)} .jside dd{margin:0;color:var(--ink);display:flex;gap:8px;align-items:center}
.jside .av{width:24px;height:24px;font-size:11px}
.status{display:inline-flex;height:26px;align-items:center;padding:0 11px;border-radius:13px;border:1px solid var(--rule);color:var(--ink);font-size:13.5px;background:var(--paper)}

/* GitLab-style proposed change */
.mr{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.mrhead{padding:16px 28px 12px}
.mrtitle{font-size:24px;line-height:1.2;color:var(--ink);font-weight:500;letter-spacing:-.012em}
.mrtitle .iid{color:var(--mute);font-weight:400;margin-left:8px}
.mrmeta{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:14.5px;color:var(--mute);flex-wrap:wrap}
.branch{font-family:var(--mono);font-size:13px;background:var(--paper);padding:2px 7px;border-radius:5px;color:var(--body)}
.issue-ref{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 11px;border-radius:13px;background:var(--paper);color:var(--ink);font-size:13.5px;border:1px solid var(--rule)}
.journey.p2:not(.p3) .issue-ref{animation:refPulse 1.2s ease .5s both}
@keyframes refPulse{0%{border-color:var(--rule)}35%{border-color:var(--ink)}100%{border-color:var(--rule)}}
.tabs{display:flex;gap:26px;padding:0 28px;border-bottom:1px solid var(--rule);font-size:14.5px;color:var(--mute)}
.tabs span{padding:9px 0;border-bottom:2px solid transparent}
.tabs span.on{color:var(--ink);border-bottom-color:var(--ink)}
.mrsplit{position:relative;display:grid;grid-template-columns:1fr 380px;gap:44px;padding:16px 28px 14px;min-height:0}
.diff{background:var(--paper);border-radius:10px;overflow:hidden;align-self:start;border:1px solid var(--rule)}
.fhead{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:14px;color:var(--ink)}
.fhead .st{margin-left:auto;font-family:var(--font);font-size:13.5px;display:flex;gap:8px}
.add-n{color:var(--add-mark)} .del-n{color:var(--del-mark)}
.rows{position:relative;font-family:var(--mono);font-size:16.5px}
.row{position:relative;display:grid;grid-template-columns:42px 42px 24px 1fr;height:31px;align-items:center;white-space:pre}
.row .ln{color:var(--mute);font-size:13px;text-align:right;padding-right:10px}
.row .sg{text-align:center}
.row.add{background:var(--add)} .row.add .sg{color:var(--add-mark)}
.row.del{background:var(--del)} .row.del .sg{color:var(--del-mark)} .row.del .code{color:var(--body)}
.row .code{color:var(--ink)}
.scan{position:absolute;left:0;right:0;top:0;height:31px;background:var(--ink);opacity:0;pointer-events:none;mix-blend-mode:normal}
.journey.p5 .scan{animation:scan 1.7s cubic-bezier(.45,0,.25,1) .15s both}
@keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.07}90%{opacity:.07}100%{transform:translateY(310px);opacity:0}}
.journey.p6 .row.c1{animation:flash 1s ease .2s both}
.journey.p6 .row.c2{animation:flash 1.1s ease 1.1s both}
@keyframes flash{0%,100%{box-shadow:inset 4px 0 0 transparent}30%,70%{box-shadow:inset 4px 0 0 var(--ink)}}
.gmark{position:absolute;left:14px;top:7px;width:15px;height:16px;color:var(--ink);opacity:0}
.journey.p7 .gmark{animation:riIn .5s ease .9s both}
.hlbox{position:absolute;left:3px;right:3px;border:2px solid var(--ink);border-radius:7px;opacity:0;pointer-events:none}
.journey.p8 .hlbox{animation:hlIn .55s cubic-bezier(.2,.7,.2,1) .1s both}
@keyframes hlIn{from{opacity:0;clip-path:inset(0 100% 0 0 round 7px)}to{opacity:1;clip-path:inset(0 0 0 0 round 7px)}}
.journey.p8 .row:not(.hl){animation:dimTo .5s ease .1s both}
.journey.p8 .row:not(.hl) .gmark{display:none}
.anno{position:absolute;right:10px;top:4px;height:23px;display:flex;align-items:center;font-family:var(--font);font-size:13.5px;color:var(--ink);background:var(--surface);padding:0 10px;border-radius:12px;border:1px solid var(--rule);opacity:0}
.journey.p9 .anno{animation:riIn .4s ease both;animation-delay:calc(.15s + var(--i)*.28s)}
.conn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.conn path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.journey.p8 .conn path{animation:draw .45s ease .5s both}
@keyframes draw{to{stroke-dashoffset:0}}
/* Decision beat: show code focus only while investigating */
.journey[data-beat="12"] .row,.journey[data-beat="12"] .hlbox,.journey[data-beat="12"] .anno,.journey[data-beat="12"] .conn path{animation:none}
.journey[data-beat="12"] .hlbox,.journey[data-beat="12"] .anno{opacity:0;transition:opacity .35s}
.journey[data-beat="12"] .conn path{stroke-dashoffset:1}
.journey[data-beat="12"] .row{transition:opacity .35s}
.journey.inv .hlbox,.journey.inv .anno{opacity:1}
.journey.inv .row:not(.hl){opacity:.42}

/* Review side column */
.side{position:relative;min-height:0}
.L{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.journey[data-layer="L1"] .L1,.journey[data-layer="L2"] .L2,.journey[data-layer="L3"] .L3,.journey[data-layer="L4"] .L4{opacity:1;visibility:visible;transition:opacity .35s ease .1s,visibility 0s}
.sideh{font-size:14px;color:var(--mute);margin:0 0 10px;font-weight:500}
.person{display:flex;align-items:center;gap:10px;font-size:15.5px;color:var(--ink);margin-bottom:24px}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:18px;font-size:15px;color:var(--mute)}

.gpanel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;height:100%;display:flex;flex-direction:column}
.gph{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.gph .mark{width:22px;height:24px}
.gph b{color:var(--ink);font-weight:550;font-size:16px;display:block}
.gph small{display:block;font-size:13px;color:var(--mute)}
.journey.p4 .gph .lift{animation:lift 1.3s cubic-bezier(.2,.7,.1,1) .1s both}
.stg{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--faint)}
.stg:last-of-type{border-bottom:0}
.stg .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule);margin-top:4px;transition:background .3s,border-color .3s}
.stg .t{font-size:15.5px;color:var(--mute);transition:color .3s;display:flex;gap:10px;align-items:baseline}
.stg .t .done{margin-left:auto;font-size:13.5px;color:var(--mute);display:none;white-space:nowrap}
.journey.p5 .s0 .t .done,.journey.p6 .s1 .t .done,.journey.p7 .s2 .t .done{display:inline}
.journey.p5 .s0 .sb,.journey.p6 .s1 .sb,.journey.p7 .s2 .sb{display:none!important}
.stg .sb{display:none;margin-top:7px;font-size:14.5px;line-height:1.45;color:var(--body)}
.sb .ri{display:flex;gap:8px;align-items:baseline;opacity:0;margin-top:4px}
.sb .ri .n{color:var(--mute);min-width:14px}
.sb .ri .v{margin-left:auto;flex:none}
.journey.p4 .s0 .dot,.journey.p5 .s1 .dot,.journey.p6 .s2 .dot,.journey.p7 .s3 .dot{border-color:var(--ink);animation:ring 1s ease both}
.journey.p5 .s0 .dot,.journey.p6 .s1 .dot,.journey.p7 .s2 .dot{background:var(--ink);border-color:var(--ink);animation:none}
.journey.p4 .s0 .t,.journey.p5 .s1 .t,.journey.p6 .s2 .t,.journey.p7 .s3 .t{color:var(--ink)}
.journey.p5 .s0 .t,.journey.p6 .s1 .t,.journey.p7 .s2 .t{color:var(--body)}
.journey.p4 .s0 .sb,.journey.p5 .s1 .sb,.journey.p6 .s2 .sb,.journey.p7 .s3 .sb{display:block}
.journey.p4 .s0 .ri,.journey.p5 .s1 .ri,.journey.p6 .s2 .ri,.journey.p7 .s3 .ri{animation:riIn .4s ease both;animation-delay:calc(.15s + var(--i,0)*.25s)}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--faint)}40%{box-shadow:0 0 0 7px var(--faint)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes riIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gfoot{margin-top:auto;padding-top:10px;font-size:13px;line-height:1.4;color:var(--mute);border-top:1px solid var(--rule)}

.slotA{position:relative;height:110px}
.sum,.reqc{position:absolute;inset:0;opacity:0}
.sum{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:10px}
.sum .mark{width:22px;height:24px;flex:none}
.sum b{display:block;color:var(--ink);font-weight:550;font-size:17px}
.sum small{font-size:14px;color:var(--mute)}
.journey.p8 .sum{animation:riIn .4s ease .2s both}
.journey.p9 .sum{animation:fadeOut .25s ease both}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.reqc{border:1px solid var(--ink);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.reqc .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.reqc p{font-size:15.5px;line-height:1.4;color:var(--ink)}
.journey.p9 .reqc{animation:slideIn .45s cubic-bezier(.2,.7,.2,1) .2s both}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.vlink{height:10px;margin-left:30px;border-left:1.5px solid var(--ink);opacity:0}
.journey.p9 .vlink{animation:fadeIn .3s ease .55s both}
.slotB{position:relative}
.cmt{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 18px 14px;opacity:0}
.journey.p8 .cmt{animation:slideIn .45s cubic-bezier(.2,.7,.2,1) .65s both}
.cmth{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--mute);margin-bottom:10px}
.cmth b{color:var(--ink);font-weight:550;font-size:15px}
.cmth .pill{margin-left:auto}
.cmt .ttl{font-size:19px;line-height:1.3;color:var(--ink);font-weight:550;letter-spacing:-.01em;margin-bottom:6px}
.cmt .bdy{font-size:15px;line-height:1.44;color:var(--body)}
.w{opacity:0}
.journey.p8 .w{animation:wIn .3s ease both;animation-delay:calc(.95s + var(--i)*30ms)}
@keyframes wIn{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
.after{opacity:0}
.journey.p8 .after{animation:riIn .35s ease both;animation-delay:var(--end)}
.cmtf{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--mute);align-items:baseline;flex-wrap:wrap}
.cmtf .linkbtn{font-size:13.5px}
.why{margin-top:10px;padding-left:16px;border-left:3px solid var(--ink);opacity:0}
.why .fh{margin-bottom:4px}
.why p{font-size:15.5px;line-height:1.4;color:var(--ink)}
.journey.p9 .cmt .cmtf{display:none}
.journey.p9 .why{animation:riIn .45s ease 1s both}

/* Decision layer */
.ccompact{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.ccompact .ttl{font-size:16.5px;color:var(--ink);font-weight:550;margin-top:6px}
.keys3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.dkey{height:62px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);text-align:left;padding:0 13px;font-size:16px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;transition:background .18s,border-color .18s}
.dkey:hover{border-color:var(--ink)}
.dkey small{font-size:12.5px;color:var(--mute)}
.dkey[aria-pressed="true"]{background:var(--decide);border-color:var(--decide);color:var(--on-decide)}
.dkey[aria-pressed="true"] small{color:var(--on-decide)}
.keys3.nudge .dkey{animation:nudge .8s ease}
@keyframes nudge{30%{border-color:var(--ink);transform:translateY(-2px)}}
.dout{margin-top:12px}
.dout>*{animation:riIn .35s ease both}
.reply{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:15px;line-height:1.45;color:var(--ink)}
.reply .who{font-size:13px;color:var(--mute)}
.nextc{margin-top:10px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.45;color:var(--ink)}
.nextc .fh{margin-bottom:4px}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:1.42;color:var(--ink)}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:4px}
.checks .n{color:var(--mute)}
.reason textarea{width:100%;height:62px;resize:none;border-radius:10px;border:1px solid var(--rule);background:var(--paper);padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--rule);background:none;font-size:13px;color:var(--body);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.dstatus{font-size:13.5px;color:var(--mute);margin-top:8px}
.dnote{font-size:13px;line-height:1.4;color:var(--mute);margin-top:10px}

/* Teams-style chat */
.teams{display:grid;grid-template-columns:62px 236px 1fr;height:100%}
.trail{border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:18px;color:var(--mute)}
.trail svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
.trail .on{color:var(--ink)}
.tlist{border-right:1px solid var(--rule);padding:16px 12px}

.titem{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-size:14.5px;color:var(--mute)}

.titem small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tconv{display:grid;grid-template-rows:52px 1fr 60px;min-height:0}
.tch{border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:0 24px;color:var(--ink);font-weight:550;font-size:16px}
.tch span{font-weight:400;font-size:14px;color:var(--mute);border-bottom:2px solid var(--ink);padding:16px 0 14px;margin-left:18px;color:var(--ink)}
.tmsgs{padding:18px 28px;display:flex;flex-direction:column;gap:12px;min-height:0}
.tday{align-self:center;font-size:13px;color:var(--mute)}
.tmsg{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;opacity:0}
.tmsg .av{width:34px;height:34px}
.journey.p10 .tmsg{animation:slideIn .5s cubic-bezier(.2,.7,.2,1) .4s both}
.tmeta{font-size:13.5px;color:var(--mute);margin-bottom:6px} .tmeta b{color:var(--ink);font-weight:550}
.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px 20px;max-width:580px}
.tcard .h{font-size:18px;color:var(--ink);font-weight:550;letter-spacing:-.01em}
.tcard .s{font-size:13.5px;color:var(--mute);margin:2px 0 12px}
.tcard dl{display:grid;grid-template-columns:128px 1fr;row-gap:7px;margin:0;font-size:15px}
.tcard dt{color:var(--mute)} .tcard dd{margin:0;color:var(--ink)}
.texp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1)}
.texp>div{overflow:hidden}
.journey.p11 .texp{grid-template-rows:1fr}
.texp .in{border-top:1px solid var(--rule);margin-top:12px;padding-top:12px;display:grid;grid-template-columns:128px 1fr;row-gap:8px;font-size:14.5px;line-height:1.42}
.texp .in dt{color:var(--mute)} .texp .in dd{margin:0;color:var(--ink)}
.tfoot{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--ink)}
.tfoot .lbl{margin-right:auto}
.tbtn{height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--rule);background:var(--surface);font-size:14px;cursor:pointer;color:var(--ink)}
.tbtn:hover{border-color:var(--ink)}
.tbtn .h2s{display:none}
.journey.p11 .tbtn .h1s{display:none}.journey.p11 .tbtn .h2s{display:inline}
.tprov{font-size:13px;line-height:1.4;color:var(--mute);margin:8px 0 0 48px;max-width:580px}
.tcompose{margin:0 24px 14px;border:1px solid var(--rule);border-radius:8px;display:flex;align-items:center;padding:0 14px;font-size:14px;color:var(--mute)}

/* Footer transport and shortcuts */
.transport{display:flex;gap:8px;align-items:center}
.transport .ctl[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#keys{position:absolute;right:64px;bottom:88px;width:360px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 22px;z-index:16;display:none;font-size:14px}
#keys.open{display:block}
#keys b{display:block;color:var(--ink);font-weight:550;margin-bottom:10px}
#keys dl{display:grid;grid-template-columns:110px 1fr;row-gap:7px;margin:0}
#keys dt{color:var(--ink)} #keys dd{margin:0;color:var(--mute)}
#keys kbd{font-family:inherit;border:1px solid var(--rule);border-radius:5px;padding:1px 6px;background:var(--paper);font-size:12.5px}
.journey.enter{animation:enter .28s ease-out both}
.journey.paused *,.journey.paused *::before,.journey.paused *::after{animation-play-state:paused!important}


/* ---------- Task Manager journey (iteration 3 foundation) ---------- */
.journey[data-app="tjira"] .app-tjira,.journey[data-app="tm"] .app-tm,.journey[data-app="prep"] .app-prep,.journey[data-app="chain"] .app-chain{opacity:1;visibility:visible;transform:none;
  transition:opacity .38s ease .1s,transform .42s cubic-bezier(.2,.7,.2,1) .1s,visibility 0s}
.journey[data-app="tjira"] .tool .t-tjira,.journey[data-app="tm"] .tool .t-tm,.journey[data-app="prep"] .tool .t-prep,.journey[data-app="chain"] .tool .t-prep{opacity:1}
.recon span{display:none}
.journey[data-app="tjira"] .recon .r-ui,.journey[data-app="tm"] .recon .r-ui{display:inline}
.journey[data-app="prep"] .recon .r-dia,.journey[data-app="chain"] .recon .r-dia{display:inline}

/* Placeholder and skeleton language: one recognisable "awaiting Karl" treatment */
.slot{display:flex;align-items:center;gap:9px;border:1.5px dashed var(--rule);border-radius:6px;padding:8px 12px;color:var(--mute);font-size:13.5px;line-height:1.35}
.slot::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.sk{display:block;height:9px;border-radius:5px;background:var(--faint)}
.karl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.karl::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* Jira ticket, Task Manager example */
.tj{padding:24px 32px;height:100%}
.tj .jcols{grid-template-columns:1fr 270px}
.tj .wf{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.tj .st2{display:inline-grid}
.tj .st2 span{grid-area:1/1;display:inline-flex;height:26px;align-items:center;padding:0 11px;border-radius:13px;border:1px solid var(--rule);font-size:13.5px;color:var(--ink);background:var(--paper)}
.tj .st2 .s-b{opacity:0}
.journey.tmj.p0 .tj .st2 .s-a{animation:fadeOut .3s ease 1s both}
.journey.tmj.p0 .tj .st2 .s-b{animation:fadeIn .3s ease 1.1s both;border-color:var(--ink)}
.tj .pick{opacity:0}
.journey.tmj.p0 .tj .pick{animation:riIn .4s ease 1.2s both}

/* Task Manager application: denser, form-based, older desktop idiom */
.tma{display:grid;grid-template-rows:28px 1fr;height:100%;font-size:14px}
.tmmenu{display:flex;gap:20px;align-items:center;padding:0 16px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--body);background:var(--paper)}
.tmbody{display:grid;grid-template-columns:212px 1fr;min-height:0}
.tmtree{border-right:1px solid var(--rule);padding:12px 0;font-size:13.5px;color:var(--body);background:var(--paper)}
.tmtree div{padding:4px 14px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tmtree .g{color:var(--mute);margin-top:8px}
.tmtree .i{padding-left:30px}
.tmtree .on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}
.tmtree i{width:10px;height:10px;border:1.2px solid currentColor;border-radius:2px;flex:none}
.tmmain{display:grid;grid-template-rows:auto auto 1fr;min-height:0;padding:16px 22px 14px}
.tmhead{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.tmhead b{font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.tmhead span{font-size:13px;color:var(--mute)}
.tmtabs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.tmtabs span{padding:6px 16px;border:1px solid var(--rule);border-bottom:0;border-radius:4px 4px 0 0;font-size:13.5px;color:var(--mute);background:var(--paper);margin-bottom:-1px;transition:color .25s,background .25s}
.journey[data-tab="details"] .tmtabs .tb-details,.journey[data-tab="wip"] .tmtabs .tb-wip,.journey[data-tab="review"] .tmtabs .tb-review,.journey[data-tab="history"] .tmtabs .tb-history{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--surface)}
.tmpane{position:relative;min-height:0;border:1px solid var(--rule);border-top:0;border-radius:0 0 4px 4px;padding:16px 18px;background:var(--surface)}
.tp{position:absolute;inset:16px 18px;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s}
.journey[data-tab="details"] .tp-details,.journey[data-tab="wip"] .tp-wip,.journey[data-tab="review"] .tp-review,.journey[data-tab="history"] .tp-history{opacity:1;visibility:visible;transition:opacity .3s ease .05s,visibility 0s}

/* Details: classic labelled form */
.form{display:grid;grid-template-columns:150px 1fr;row-gap:0;font-size:14.5px;border-top:1px solid var(--faint)}
.form dt,.form dd{margin:0;padding:10px 0;border-bottom:1px solid var(--faint)}
.form dt{color:var(--mute);text-align:right;padding-right:18px}
.form dd{color:var(--ink);display:flex;gap:10px;align-items:center}
.lnk{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:13.5px}
.journey.tmj.p1:not(.p2) .lnk{animation:refPulse 1.2s ease .5s both}

/* WIP tab */
.wiphead{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin-bottom:14px;align-items:center}
.wiphead dt{color:var(--mute)} .wiphead dd{margin:0;color:var(--ink);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ed{height:24px;display:inline-flex;align-items:center;padding:0 9px;border-radius:4px;border:1px solid var(--rule);font-size:13px;color:var(--body);background:var(--paper)}
.wipviews{position:relative;height:calc(100% - 92px)}
.wv{position:absolute;inset:0;transition:opacity .35s}
.wv-files{opacity:1}
.journey.tmj.p3 .wv-files{opacity:0;visibility:hidden}
.wv-cmp{opacity:0;visibility:hidden}
.journey.tmj.p3 .wv-cmp{opacity:1;visibility:visible}
.ftab{width:100%;border-collapse:collapse;font-size:13.5px}
.ftab th{text-align:left;font-weight:450;color:var(--mute);border-bottom:1px solid var(--rule);padding:7px 10px;background:var(--paper)}
.ftab td{border-bottom:1px solid var(--faint);padding:11px 10px;color:var(--ink)}
.ftab tr.sel td{background:var(--paper)}
.ftab .sk{width:var(--w,60%)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:calc(100% - 46px)}
.cmpp{border:1px solid var(--rule);border-radius:4px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column}
.cmph{font-size:13px;color:var(--mute);padding:6px 10px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.cl{display:grid;grid-template-columns:34px 1fr;align-items:center;height:21px;padding-right:10px}
.cl em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--mute);text-align:right;padding-right:10px}
.cl .sk{width:var(--w)}
.cl.ch{background:var(--del)} .cmpp.chg .cl.ch{background:var(--add)}
.journey.tmj.p3 .cl.ch{animation:flash 1.1s ease .5s both}
.cmpimg{width:100%;height:100%;object-fit:contain}
.cmpnote{margin-top:10px}
.toast{position:absolute;right:18px;bottom:16px;width:400px;background:var(--surface);border:1px solid var(--ink);border-radius:10px;padding:14px 16px;opacity:0;visibility:hidden;font-size:14px;line-height:1.45;color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.toast .th{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:8px}
.toast .msg{display:grid;grid-template-columns:30px 1fr;gap:10px}
.toast .who{font-size:13px;color:var(--mute)}
.toast .men{display:flex;gap:6px;margin-top:8px}
.toast .men span{font-size:12.5px;border:1px solid var(--rule);border-radius:12px;padding:1px 9px;color:var(--body)}
.journey.tmj.p4:not(.p5) .toast{visibility:visible;animation:slideIn .5s cubic-bezier(.2,.7,.2,1) .35s both}

/* Preparation diagram (fixed coordinates so connectors are deterministic) */
.prep{position:absolute;left:50%;top:50%;width:1040px;height:500px;margin:-262px 0 0 -520px}
.prep>svg{position:absolute;inset:0;width:1040px;height:500px;overflow:visible}
.prep>svg path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.pin,.pnode,.pout{position:absolute;border:1px solid var(--rule);border-radius:12px;background:var(--paper);padding:14px 18px;transition:opacity .4s,border-color .4s}
.pin{left:0;width:300px;height:124px;opacity:.38}
.pin .h{font-size:13px;color:var(--mute)} .pin b{display:block;font-size:18px;font-weight:500;color:var(--ink);margin:3px 0 6px;letter-spacing:-.01em}
.pin p{font-size:14px;line-height:1.4;color:var(--body)}
.pin .pchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pin .pchips span{font-size:12px;border:1px solid var(--rule);border-radius:10px;padding:0 8px;color:var(--body)}
.pin1{top:28px}.pin2{top:188px}.pin3{top:348px}
.pnode{left:420px;top:175px;width:200px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;opacity:.38}
.pnode .mark{width:34px;height:37px}
.pnode b{font-size:18px;font-weight:550;color:var(--ink)} .pnode small{font-size:13.5px;color:var(--mute)}
.pout{left:740px;width:300px;opacity:0}
.pout1{top:70px;height:150px}.pout2{top:282px;height:118px}
.pout b{display:block;font-size:17px;font-weight:500;color:var(--ink);margin-bottom:8px;letter-spacing:-.01em}
.pout p{font-size:14px;line-height:1.4;color:var(--body)}
.sev{display:flex;gap:6px;margin-top:10px}
.sev span{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--rule);font-size:12.5px;color:var(--ink)}
.sev span i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
.sev .c i{background:var(--ink)} .sev .m i{box-shadow:inset 4px 0 0 var(--ink)}
.pfoot{position:absolute;left:0;right:0;bottom:-26px;font-size:13px;color:var(--mute);opacity:0}
.journey.tmj.p5 .pin1,.journey.tmj.p6 .pin2,.journey.tmj.p7 .pin3{opacity:1;border-color:var(--ink)}
.journey.tmj.p8 .pin{border-color:var(--rule)}
.journey.tmj.p5 .pnode{opacity:1;border-color:var(--ink)}
.journey.tmj.p5 .pnode .lift{animation:lift 1.3s cubic-bezier(.2,.7,.1,1) .2s both}
.journey.tmj.p5 .pa1,.journey.tmj.p6 .pa2,.journey.tmj.p7 .pa3{animation:draw .5s ease .25s both}
.journey.tmj.p7 .pa4,.journey.tmj.p7 .pa5{animation:draw .5s ease 1s both}
.journey.tmj.p7 .pout{animation:riIn .45s ease 1.35s both}
.journey.tmj.p7 .pout2{animation-delay:1.55s}
.journey.tmj.p5 .pfoot{animation:fadeIn .4s ease .6s both}

/* Review record */
.rv{display:grid;grid-template-rows:auto auto 1fr;gap:12px;height:100%}
.rvh{display:flex;align-items:center;gap:12px}
.rvh .mark{width:20px;height:22px}
.rvh b{font-size:16px;font-weight:550;color:var(--ink);display:block} .rvh small{font-size:13px;color:var(--mute);display:block}
.rvh .slot{margin-left:auto;padding:5px 10px}
.fnd{width:100%;border-collapse:collapse;font-size:13.5px}
.fnd th{text-align:left;font-weight:450;color:var(--mute);border-bottom:1px solid var(--rule);padding:6px 10px;background:var(--paper)}
.fnd td{border-bottom:1px solid var(--faint);padding:0 10px;height:34px;color:var(--mute)}
.fnd td.n{width:36px;color:var(--mute)}
.fnd td.s{width:120px}
.fnd .sk{width:var(--w)}
.fnd tr{opacity:0}
.journey.tmj.p8 .fnd tr{animation:riIn .35s ease both;animation-delay:calc(.2s + var(--i)*.12s)}
.journey.tmj.p8 .fnd thead tr{animation-delay:.1s}
.rvlow{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.tbox{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:8px;min-height:0}
.tbox .h{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.sevx{opacity:.38;transition:opacity .4s,border-color .4s}
.journey.tmj.p9 .sevx{opacity:1;border-color:var(--ink)}
.sevbtns{display:flex;gap:6px}
.sevbtn{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--rule);background:none;font-size:13.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.sevbtn i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.sevbtn.c i{background:var(--ink)} .sevbtn.m i{box-shadow:inset 4.5px 0 0 var(--ink)}
.sevbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--surface)}
.sevout{font-size:14.5px;line-height:1.45;color:var(--ink)}
.sevout b{font-weight:550}
.sevout small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px}

/* Human review chain */
.chain{position:absolute;left:50%;top:50%;width:1000px;margin-left:-500px;transform:translateY(-55%)}
.chrow{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:center}
.chn{border:1px solid var(--rule);border-radius:12px;padding:16px 16px;background:var(--paper);min-height:132px;display:flex;flex-direction:column;gap:6px;opacity:0}
.chn .mark{width:20px;height:22px}
.chn b{font-size:17px;font-weight:550;color:var(--ink)} .chn p{font-size:13.5px;line-height:1.4;color:var(--body)}
.chn .av{width:28px;height:28px}
.chn.fin{background:var(--decide);border-color:var(--decide)} .chn.fin b,.chn.fin p{color:var(--on-decide)}
.chl{height:1.5px;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.journey.tmj.p10 .chn{animation:riIn .4s ease both;animation-delay:calc(.15s + var(--i)*.35s)}
.journey.tmj.p10 .chl{animation:grow .3s ease both;animation-delay:calc(.35s + var(--i)*.35s)}
@keyframes grow{to{transform:scaleX(1)}}
.chnote{margin-top:22px;font-size:14px;color:var(--mute);opacity:0;max-width:70ch}
.journey.tmj.p10 .chnote{animation:fadeIn .4s ease 1.6s both}

/* History */
.hist{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:100%}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:1.5px solid var(--rule);display:flex;flex-direction:column;gap:9px}
.tl li{position:relative;font-size:14px;color:var(--ink);opacity:0;line-height:1.35}
.tl li small{display:block;color:var(--mute);font-size:12.5px}
.tl li::before{content:"";position:absolute;left:-24px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--ink)}
.tl li.gu::before{background:var(--ink)}
.journey.tmj.p11 .tl li{animation:riIn .35s ease both;animation-delay:calc(.15s + var(--i)*.14s)}
.hrec{align-self:start;border:1px solid var(--ink);border-radius:6px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:10px;opacity:0}
.journey.tmj.p11 .hrec{animation:slideIn .45s cubic-bezier(.2,.7,.2,1) 1.2s both}
.hrec .h{display:flex;align-items:center;gap:10px}
.hrec .h .mark{width:18px;height:20px}
.hrec .h b{font-size:15px;font-weight:550;color:var(--ink)}


/* ---------- Commercial impact (iteration 4) ----------
   --biz and --biz-tint are a neutral placeholder accent, used only in this sequence.
   They are NOT MIP brand colours: replace both tokens when MIP's brand palette is supplied. */
:root{--biz:#3E6C93;--biz-tint:#DCE5EC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--biz:#86ADD0;--biz-tint:#22303B}}
:root[data-theme="dark"]{--biz:#86ADD0;--biz-tint:#22303B}
.journey.bzj{grid-template-rows:1fr}
.bz-field{position:relative;align-self:center;justify-self:center;width:1060px;height:620px}
.bz-field>svg{position:absolute;inset:0;width:1060px;height:620px;overflow:visible;pointer-events:none}
.bz-line{fill:none;stroke:var(--biz);stroke-width:1.5;stroke-dasharray:1;stroke-dashoffset:1}
.bz-pulse{fill:none;stroke:var(--biz);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:.07 1.2;stroke-dashoffset:.07;opacity:0}
.bz-line.new,.bz-line.pro{stroke-dasharray:.03 .03;stroke-dashoffset:0;opacity:0}

.bz-sel{position:absolute;left:200px;top:0;display:inline-flex;border:1px solid var(--rule);border-radius:24px;padding:3px;opacity:0;visibility:hidden}
.bz-sel button{border:0;background:none;height:40px;padding:0 20px;border-radius:20px;font-size:15.5px;color:var(--body);cursor:pointer;transition:background .25s,color .25s}
.bz-sel button[aria-pressed="true"]{background:var(--biz);color:var(--paper)}

/* Connector from highlighted code to the comment. Layout offsets ignore the stage transform, so this is scale-independent. */
function offsetIn(el, anc){ let x=0,y=0; while(el && el!==anc){ x+=el.offsetLeft; y+=el.offsetTop; el=el.offsetParent; } return {x,y}; }
function drawConnector(){
  const split=$("mrsplit"), box=document.querySelector(".hlbox"), slot=$("slotB"); if(!split||!box||!slot) return;
  const b=offsetIn(box,split), s=offsetIn(slot,split);
  const x1=b.x+box.offsetWidth+3, y1=b.y+box.offsetHeight/2, x2=s.x-2, y2=s.y+30;
  $("connpath").setAttribute("d",`M${x1},${y1} C${x1+22},${y1} ${x2-22},${y2} ${x2},${y2}`);
}

/* ---------- Beats ---------- */
function setBeat(k, prev, cfg){
  const j=J(); if(!j) return;
  resumeAll(j);
  const BEATS=cfg.beats, PHASES=cfg.phases;
  const B=BEATS[k];
  j.dataset.app=B.app; j.dataset.layer=B.layer||""; 
  if(k<prev){
    for(let i=k+1;i<BEATS.length;i++) j.classList.remove("p"+i);
    j.dataset.beat=k; flush(j); finishAll(j);
  } else {
    j.classList.remove("p"+k);
    for(let i=0;i<BEATS.length;i++) j.classList.toggle("p"+i, i<k);
    j.dataset.beat=k; flush(j);
    if(k!==prev+1 || prev<0) finishAll(j);
    j.classList.add("p"+k);
  }
  cfg.onBeat && cfg.onBeat(j,B,k);
  // phase strip
  j.querySelectorAll(".jstrip button").forEach((btn,i)=>{
    const p=PHASES[i], first=p.beats[0], last=p.beats[p.beats.length-1];
    btn.classList.toggle("now", k>=first && k<=last); btn.classList.toggle("done", k>last);
    btn.setAttribute("aria-current", k>=first && k<=last ? "step" : "false");
  });
  j.querySelectorAll(".jstrip i[data-b]").forEach(d=>d.classList.toggle("on", +d.dataset.b<=k));
  // narration
  const cw=$("capwrap");
  cw.innerHTML=`<p class="cap">${esc(B.cap)}</p><p class="capsub">${esc(B.sub)}</p>`;
  cw.classList.remove("swap"); if(k!==prev){ flush(cw); cw.classList.add("swap"); }
  $("legend").innerHTML = B.tags.map(t=>`<span class="${TAG[t][0]}">${TAG[t][1]}</span>`).join("");
  $("explore").innerHTML = B.explore.map(([d,l])=>`<button class="linkbtn" data-drawer="${d}">${l}</button>`).join("");
  state.nudged=false;
  updateTransport();
}
/* Pause is CSS-driven: pausing through the Animation API detaches CSS animations from their selectors. */
function resumeAll(j){ if(!state.paused) return; j.classList.remove("paused"); state.paused=false; }
function togglePause(){
  const j=J(); if(!j) return;
  if(state.paused){ resumeAll(j); }
  else { j.classList.add("paused"); state.paused=true; }
  updateTransport();
}
function replayBeat(){
  const j=J(); if(!j) return; resumeAll(j);
  const st=scenes[state.s].steps[state.k]; const k=state.k-(st.jr?JOURNEYS[st.jr].offset:0); finishAll(j);
  j.classList.remove("p"+k); flush(j); j.classList.add("p"+k);
  const cw=$("capwrap"); cw.classList.remove("swap"); flush(cw); cw.classList.add("swap");
  updateTransport();
}
function skipBeat(){ const j=J(); if(!j) return; resumeAll(j); finishAll(j); updateTransport(); }
function updateTransport(){
  const b=document.querySelector('[data-tp="pause"]'); if(!b) return;
  b.textContent = state.paused ? "Resume" : "Pause"; b.setAttribute("aria-pressed", state.paused);
}

        <div class="cx-left"><div class="cx-tiles">
          <div class="cx-tile"><b>${esc(U.sizeClass)}</b><span>Size class of Karl’s example</span></div>
          <div class="cx-tile"><b>≈ ${Math.round(U.quotaShare*100)}%</b><span>of his ${esc(U.quota)}</span></div>
          <div class="cx-tile"><b>${esc(U.duration)}</b><span>Review time for the example</span></div></div></div>
        <div class="cx-right"><p class="result">≈ ${cap}<small>reviews a day, in theory</small></p>
          <p class="small">Similarly sized reviews that would fit within that daily quota: 1 ÷ ${Math.round(U.quotaShare*100)}%. Not a verified production throughput.</p></div>
      </div>
      <p class="small excl">Subscription cost and cost per review are not yet verified, and aren’t calculated from the quota. Possible future improvement, not implemented: developer-associated Devin sessions to manage usage. <button class="linkbtn" style="font-size:15px" data-drawer="tmcost">About this evidence</button></p>
     </section>
    </div>
   </div></div>`;
}
function tmCostHtml(){ const U=TMX.karl.usage; return `<h4>Task Manager usage (Karl’s initial evidence)</h4>
  <dl><dt>Example size</dt><dd>${esc(U.sizeClass)}</dd><dt>Quota used</dt><dd>About ${Math.round(U.quotaShare*100)}% of Karl’s ${esc(U.quota)}</dd><dt>Review time</dt><dd>${esc(U.duration.replace(" s"," seconds"))}</dd><dt>Source</dt><dd>${esc(U.source)}; one example, not independently audited</dd></dl>
  <h4>What the ~${Math.round(1/U.quotaShare)} means</h4><p>If similarly sized reviews each used about the same share, roughly ${Math.round(1/U.quotaShare)} would fit within one person’s daily quota. That is theoretical capacity, not verified production throughput: larger changes use more, and quotas, plans and concurrency may differ.</p>
  <h4>Not established</h4><ul><li>The monetary subscription cost and its billing basis</li><li>The actual cost per review. It isn’t derived from the quota percentage.</li><li>How the configured 5 ACU session limit relates to the quota. It isn’t a price.</li></ul>
  <h4>Possible future improvement</h4><p>Developer-associated Devin sessions, so usage can be attributed and managed per developer. Not implemented.</p>`; }
function evidenceFor(id){
  if(id==="gitlab") return evidenceGitlab();
  if(id==="value") return (scenes[state.s].steps[state.k].jr==="biz" ? bizEvidence() : "")+methodHtml()+tmCostHtml()+`<h4>Benefits</h4><p>C14 and C15 are potential benefits only. No hours saved, adoption or quality improvement has been measured.</p>`;
  if(id==="tm") return `<h4>Disclosure</h4><p>Reconstructed workflow. No Task Manager review output, screenshots or code have been supplied yet, and nothing here is connected to Devin, Teams or Task Manager.</p>
    <h4>Described first-hand by Karl (not independently audited)</h4><ul>${TMX.karl.workflow.map(w=>`<li>${esc(w)}</li>`).join("")}<li>${esc(TMX.karl.outcomeRule)} Not verified as automatic enforcement of approval or merge.</li><li>${esc(TMX.karl.timing)}</li></ul>
    <h4>Owner-supplied context</h4><p>A separate implementation in an older, non-Git environment using Devin, serving a substantially larger part of MIP (U01–U03). No headcount, adoption or review volume is established.</p>
    <h4>Potential value, as Karl describes it</h4><p>Less time on routine issues such as whitespace, indentation, spelling and coding standards; earlier, actionable feedback; maintained code quality; review comments and context preserved; easier return to older tasks. None of these is measured.</p>
    <h4>Not yet established</h4><ul><li>Devin’s actual findings for the example</li><li>Costs and billing basis (the configured 5 ACU session limit is not a price)</li><li>How the inspected dispatch definitions (C16) relate to this implementation</li></ul>
    <p>GitLab fixtures are never relabelled as Task Manager evidence.</p>`;
  return `<h4>Owner-supplied context</h4><ul><li>Two distinct implementations: GitLab (Jady) and Task Manager (Karl, using Devin) — U01, U02.</li><li>Task Manager serves a substantially larger portion of MIP — qualitative, no headcount or volume (U03).</li><li>Teams is the primary GitLab interface (U04).</li></ul>
  <h4>Deployment</h4><p>Live GearUp workflows run on the company’s Mac mini. Inactive workflows in the audit were personal-Mac copies, not evidence of downtime (C18).</p>
  <h4>Wording status</h4><p>“AI prepares. Humans decide.” is a candidate message, not approved (C17).</p>`;
}

/* ---------- Overlays ---------- */
let lastFocus=null;
function openDrawer(key){
  closeKeys();
  state.drawer=key; const d=DRAWERS[key]();
  $("dtitle").textContent=d.title; $("dbody").innerHTML=d.html; $("dbody").scrollTop=0;
  const dr=$("drawer"); dr.inert=false; dr.removeAttribute("inert"); dr.classList.add("open"); dr.setAttribute("aria-hidden","false");
  $("scrim").classList.add("open");
  if(!lastFocus) lastFocus=document.activeElement;
  try{ $("dclose").focus({preventScroll:true}); }catch(e){}
  resetScroll();
}
function closeDrawer(){
  if(!state.drawer) return; state.drawer=null;
  const dr=$("drawer"); dr.classList.remove("open"); dr.setAttribute("aria-hidden","true"); dr.inert=true; dr.setAttribute("inert","");
  $("scrim").classList.remove("open");
  if(lastFocus && document.contains(lastFocus) && lastFocus.focus){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
  else if(document.activeElement && dr.contains(document.activeElement)) document.activeElement.blur();
  lastFocus=null; resetScroll();
}
function toggleKeys(){ state.keys=!state.keys; $("keys").classList.toggle("open",state.keys); $("btnKeys").setAttribute("aria-pressed",state.keys); }
function closeKeys(){ if(state.keys) toggleKeys(); }
function closeOverlays(){ closeDrawer(); closeKeys(); }
/* Stray-scroll guard: the stage never scrolls; only the drawer body and text fields may. */
function resetScroll(){ const f=$("fit"); if(f.scrollLeft||f.scrollTop){ f.scrollLeft=0; f.scrollTop=0; } if(window.scrollX||window.scrollY) window.scrollTo(0,0); }
document.addEventListener("scroll",e=>{
  const t=e.target;
  if(t===document||t===document.documentElement){ if(window.scrollX||window.scrollY) window.scrollTo(0,0); return; }
  if(t.id==="dbody"||t.tagName==="TEXTAREA"||t.tagName==="PRE") return;
  if(t.scrollLeft||t.scrollTop){ t.scrollLeft=0; t.scrollTop=0; }
}, true);
document.addEventListener("focusin",e=>{
  if(state.drawer && !$("drawer").contains(e.target)){ try{ $("dclose").focus({preventScroll:true}); }catch(_){} }
  resetScroll();
});

function syncCalc(){
  document.querySelectorAll("[data-period]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.period===state.period));
  const o=$("costOut"); if(o) o.innerHTML=costText();
  const c=$("cxcustom"); if(c) c.hidden=!state.volEdited;
}
/* ---------- Journey registry ---------- */
BEATS.forEach(b=>b.jr="gitlab"); TM_BEATS.forEach(b=>b.jr="tm"); BIZ_BEATS.forEach(b=>b.jr="biz");
const JOURNEYS = {
  gitlab:{ beats:BEATS, phases:PHASES, offset:0, html:journeyHTML, mounted:drawConnector,
    onBeat:(j,B)=>{ j.classList.toggle("inv", !!B.decide && state.decision==="investigate"); if(B.decide) renderDecision(false); } },
  tm:{ beats:TM_BEATS, phases:TM_PHASES, offset:1, html:tmHTML, onBeat:tmOnBeat },
  biz:{ beats:BIZ_BEATS, phases:[], offset:0, html:bizHTML, onBeat:bizOnBeat }
};

/* ---------- Render ---------- */
function render(prevS, prevK){
  const sc=scenes[state.s], st=sc.steps[state.k];
  $("rail").innerHTML = scenes.map((x,i)=>`<button data-scene="${i}" class="${x.reserved?"reserved":""}" ${i===state.s?'aria-current="step"':""}>${x.name}${x.tag?`<span class="tag">${x.tag}</span>`:""}</button>`).join("");
  $("presenter").textContent = "";
  const dis=$("disclosure");
  dis.className="disclosure"+(sc.disclosure==="replay"?" replay":"");
  dis.innerHTML = sc.disclosure==="replay" ? `<i></i>Offline replay of synthetic evidence` : sc.disclosure==="tm" ? `<i></i>Reconstructed workflow. Review results awaiting Karl’s evidence` : st.jr==="biz" ? `<i></i>Illustrative example. Hypothetical platform and clients` : `<i></i>Offline prototype. No live connections`;
  const dots=$("dots"), jr=st.jr?JOURNEYS[st.jr]:null;
  if(jr){
    if(!dots.querySelector(".transport")) dots.innerHTML = `<div class="transport"><button class="ctl" data-tp="replay" title="Replay this step (R)">Replay</button><button class="ctl" data-tp="pause" aria-pressed="false" title="Pause or resume (P)">Pause</button><button class="ctl" data-tp="skip" title="Skip to the end of this step (S)">Skip</button></div>`;
    dots.setAttribute("aria-hidden","false");
  } else { dots.innerHTML = sc.steps.map((_,i)=>`<span class="${i===state.k?"on":""}"></span>`).join(""); dots.setAttribute("aria-hidden","true"); }
  const main=$("main");
  if(jr){
    const prevStep = prevS===state.s ? sc.steps[prevK] : null;
    let mounted = !!J() && J().dataset.jr===st.jr && prevStep && prevStep.jr===st.jr;
    let pk = mounted ? prevK - jr.offset : -1;
    if(!mounted){ main.innerHTML=jr.html(); main.firstElementChild.classList.add("enter"); jr.mounted && jr.mounted(); }
    setBeat(state.k - jr.offset, pk, jr);
  } else {
    main.innerHTML=st.render();
    main.firstElementChild.classList.add("enter");
    st.after && st.after();
  }
  const n=$("notes");
  n.innerHTML = `<b>Review notes, ${sc.name}, step ${state.k+1} of ${sc.steps.length}</b><ul>${(st.notes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  n.classList.toggle("open", state.notes);
  $("btnPrev").disabled = state.s===0 && state.k===0;
  $("btnNext").disabled = state.s===scenes.length-1 && state.k===sc.steps.length-1;
}
function go(s,k){ closeOverlays(); const pS=state.s, pK=state.k; state.s=s; state.k=k; render(pS,pK); }
function next(){
  const sc=scenes[state.s];
  if(sc.id==="gitlab" && BEATS[state.k].decide && !state.decision && !state.nudged){
    state.nudged=true; const k3=$("keys3"); if(k3){ k3.classList.remove("nudge"); flush(k3); k3.classList.add("nudge"); } return;
  }
  if(state.k<sc.steps.length-1) go(state.s,state.k+1);
  else if(state.s<scenes.length-1) go(state.s+1,0);
}
function prev(){
  if(state.k>0) go(state.s,state.k-1);
  else if(state.s>0) go(state.s-1,scenes[state.s-1].steps.length-1);
}

/* ---------- Events ---------- */
$("stage").addEventListener("click",e=>{
  /* After a mouse click, release button focus so Space keeps advancing the presentation. */
  const btn=e.target.closest("button"); if(btn && e.detail>0 && btn.id!=="dclose") setTimeout(()=>{ if(document.activeElement===btn) btn.blur(); },0);
  const t=e.target.closest("[data-scene],[data-phase],[data-sev],[data-bzpath],[data-tp],[data-teams],[data-dec],[data-chip],[data-record],[data-edit-reason],[data-drawer],[data-period],[data-preset],[data-cview]"); if(!t) return;
  if(t.dataset.scene) go(+t.dataset.scene,0);
  else if(t.dataset.phase){ const jr=JOURNEYS[scenes[state.s].steps[state.k].jr]; go(state.s, jr.offset + jr.phases[+t.dataset.phase].beats[0]); }
  else if(t.dataset.sev){ state.tmSev=t.dataset.sev; renderSev(); }
  else if(t.dataset.bzpath){ go(state.s, +t.dataset.bzpath); }
  else if(t.dataset.tp){ ({replay:replayBeat, pause:togglePause, skip:skipBeat})[t.dataset.tp](); }
  else if(t.dataset.teams==="finding") go(1, state.k===11 ? 10 : 11);
  else if(t.dataset.teams==="open") go(1, 12);
  else if(t.dataset.dec){ state.decision=t.dataset.dec; renderDecision(); if(state.decision==="reject" && !state.reasonRecorded){ const r=$("reason"); r && r.focus({preventScroll:true}); } }
  else if(t.dataset.chip!==undefined){ state.reason=t.dataset.chip; const r=$("reason"); if(r){ r.value=state.reason; } const b=document.querySelector("[data-record]"); if(b) b.disabled=false; }
  else if(t.hasAttribute("data-record")){ if(state.reason.trim()){ state.reasonRecorded=state.reason.trim(); renderDecision(); } }
  else if(t.hasAttribute("data-edit-reason")){ state.reasonRecorded=""; renderDecision(); }
  else if(t.dataset.drawer) openDrawer(t.dataset.drawer);
  else if(t.dataset.period){ state.period=t.dataset.period;
    if(!state.volEdited){ state.volume = state.period==="month" ? 167 : 2000; const v=$("vol"); if(v) v.value=state.volume; }
    syncCalc(); }
  else if(t.dataset.cview){ state.costView=t.dataset.cview; const cx=document.querySelector(".cx"); if(cx){ cx.dataset.view=state.costView;
      cx.querySelectorAll("[data-cview]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cview===state.costView));
      cx.querySelectorAll(".cx-panel").forEach(p=>{ const on=p.classList.contains("cx-"+state.costView); p.inert=!on; if(on) p.removeAttribute("inert"); else p.setAttribute("inert",""); }); } }
  else if(t.dataset.preset){ const [v,p]=t.dataset.preset.split(","); state.volume=+v; state.period=p; state.volEdited=false; const vi=$("vol"); if(vi) vi.value=state.volume; syncCalc(); }
});
$("stage").addEventListener("input",e=>{
  if(e.target.id==="vol"){ state.volume=Math.min(1e6,Math.max(0,Math.floor(+e.target.value||0))); state.volEdited=true; syncCalc(); }
  if(e.target.id==="reason"){ state.reason=e.target.value; const b=document.querySelector("[data-record]"); if(b) b.disabled=!state.reason.trim(); }
});
$("btnNext").onclick=next;
$("btnPrev").onclick=prev;
$("btnEvidence").onclick=()=>state.drawer?closeDrawer():openDrawer("evidence");
$("btnNotes").onclick=()=>{ state.notes=!state.notes; $("btnNotes").setAttribute("aria-pressed",state.notes); $("notes").classList.toggle("open",state.notes); };
$("btnKeys").onclick=toggleKeys;
$("dclose").onclick=closeDrawer;
$("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ e.preventDefault(); if(state.drawer) closeDrawer(); else closeKeys(); if(e.target.matches("input,textarea")) e.target.blur(); return; }
  if(e.target.matches("input,textarea,select,[contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
  if(state.drawer) return;
  const gl = !!scenes[state.s].steps[state.k].jr;
  if(["ArrowRight","PageDown"].includes(e.key) || (e.key===" " && !e.target.matches("button"))){ e.preventDefault(); next(); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==="?"||(e.key==="/"&&e.shiftKey)) toggleKeys();
  else if(gl && (e.key==="p"||e.key==="P")) togglePause();
  else if(gl && (e.key==="r"||e.key==="R")) replayBeat();
  else if(gl && (e.key==="s"||e.key==="S")) skipBeat();
  else if(/^[1-4]$/.test(e.key)) go(+e.key-1,0);
});

/* Fit the fixed stage to the window */
function fit(){
  const f=$("fit"), r=f.getBoundingClientRect();
  const s=Math.min(r.width/1600, r.height/900);
  $("stage").style.transform=`translate(-50%,-50%) scale(${s})`;
  resetScroll();
}
addEventListener("resize",fit); fit();
if(location.hash && /^#s[1-4]$/.test(location.hash)) state.s=+location.hash[2]-1;
render(-1,-1);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawConnector);
})();
</script>
</body>
</html>
